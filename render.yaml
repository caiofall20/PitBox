# Blueprint da API no Render (plano Free).
# No dashboard: New > Blueprint > selecione o repositório com a pasta pitbox na raiz.
# Depois preencha as env vars marcadas como sync: false.
services:
  - type: web
    name: pitbox-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_SSL
        value: "true"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PUBLIC_UPLOAD_URL
        value: /uploads
      - key: SUPABASE_STORAGE_BUCKET
        value: pitbox-photos
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
